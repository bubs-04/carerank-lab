# Only the ALB security group may reach the host's private port 8080.
# The ALB appends the true source to X-Forwarded-For. Use its last address,
# never an attacker-controlled earlier value; do not trust all forwarding headers.
set_real_ip_from 10.64.0.0/24;
set_real_ip_from 10.64.1.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 server_tokens off;
 access_log off;
 error_log /dev/stderr crit;
 client_max_body_size 64k;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
 location /api/ {
   proxy_set_header Host $host;
   proxy_set_header X-CareRank-Client-IP $remote_addr;
   proxy_set_header X-Forwarded-For "";
   proxy_set_header X-Real-IP "";
   proxy_set_header Forwarded "";
   proxy_connect_timeout 5s;
   proxy_read_timeout 30s;
   proxy_pass http://api:8000;
 }
 location / { try_files $uri $uri/ /index.html; }
}
