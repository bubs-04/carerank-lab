services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carerank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
      POSTGRES_DB: carerank
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carerank -d carerank"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://carerank:${POSTGRES_PASSWORD}@db:5432/carerank
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  seed:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://carerank:${POSTGRES_PASSWORD}@db:5432/carerank
    command: ["python", "-m", "app.pipeline"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://carerank:${POSTGRES_PASSWORD}@db:5432/carerank
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  pgdata:
