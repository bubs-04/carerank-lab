server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
 location /api/ {
   # This proxy is the trust boundary. Never append attacker-supplied forwarding values.
   proxy_set_header X-CareRank-Client-IP $remote_addr;
   proxy_set_header X-Forwarded-For "";
   proxy_set_header X-Real-IP "";
   proxy_set_header Forwarded "";
   proxy_pass http://api:8000;
 }
 location / { try_files $uri $uri/ /index.html; }
}
