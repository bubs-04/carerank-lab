services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carerank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
      POSTGRES_DB: carerank
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carerank -d carerank"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://carerank:${POSTGRES_PASSWORD}@db:5432/carerank
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  seed:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://carerank:${POSTGRES_PASSWORD}@db:5432/carerank
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  runtime:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://carerank:${POSTGRES_PASSWORD}@db:5432/carerank
      RUNTIME_DATABASE_URL: postgresql+psycopg://carerank_api:${API_DATABASE_PASSWORD:?Run make setup first}@db:5432/carerank
      WORKER_DATABASE_URL: postgresql+psycopg://carerank_worker:${WORKER_DATABASE_PASSWORD:?Run make setup first}@db:5432/carerank
    command: ["python", "-m", "app.runtime_role"]
    depends_on:
      seed: {condition: service_completed_successfully}
  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-28800}
      AUTH_TRUSTED_PROXIES: 172.30.84.3/32
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080}
      DATABASE_URL: postgresql+psycopg://carerank_api:${API_DATABASE_PASSWORD:?Run make setup first}@db:5432/carerank
      DQ_ENABLED: ${DQ_ENABLED:-true}
      DQ_REJECTED_PERCENT: ${DQ_REJECTED_PERCENT:-5}
      DQ_MISSING_PERCENT: ${DQ_MISSING_PERCENT:-5}
      DQ_DUPLICATE_PERCENT: ${DQ_DUPLICATE_PERCENT:-1}
      DQ_WARNING_RATE_CHANGE: ${DQ_WARNING_RATE_CHANGE:-10}
      DQ_ACCEPTED_CHANGE_PERCENT: ${DQ_ACCEPTED_CHANGE_PERCENT:-20}
      DQ_MEMBERSHIP_PERCENT: ${DQ_MEMBERSHIP_PERCENT:-25}
    networks:
      default: {}
      proxy: {}
    depends_on:
      runtime: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://carerank_worker:${WORKER_DATABASE_PASSWORD:?Run make setup first}@db:5432/carerank
      DQ_ENABLED: ${DQ_ENABLED:-true}
      DQ_REJECTED_PERCENT: ${DQ_REJECTED_PERCENT:-5}
      DQ_MISSING_PERCENT: ${DQ_MISSING_PERCENT:-5}
      DQ_DUPLICATE_PERCENT: ${DQ_DUPLICATE_PERCENT:-1}
      DQ_WARNING_RATE_CHANGE: ${DQ_WARNING_RATE_CHANGE:-10}
      DQ_ACCEPTED_CHANGE_PERCENT: ${DQ_ACCEPTED_CHANGE_PERCENT:-20}
      DQ_MEMBERSHIP_PERCENT: ${DQ_MEMBERSHIP_PERCENT:-25}
    command: ["python", "-m", "app.operations", "worker"]
    restart: unless-stopped
    depends_on:
      runtime: {condition: service_completed_successfully}
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    networks:
      front: {}
      proxy: {ipv4_address: 172.30.84.3}
    depends_on:
      api: {condition: service_healthy}
volumes:
  pgdata:
networks:
  front: {}
  proxy:
    internal: true
    ipam:
      config: [{subnet: 172.30.84.0/24, ip_range: 172.30.84.128/25}]
