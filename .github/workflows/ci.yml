name: CareRank checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: make lint && make test-ui
      - run: make up
      - name: Wait for application
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Disposable integration database
        run: |
          docker compose exec -T db createdb -U carerank carerank_test
          docker compose run --rm -e TEST_DATABASE_URL="postgresql+psycopg://carerank:$(sed -n 's/^POSTGRES_PASSWORD=//p' .env)@db:5432/carerank_test" api pytest -q
      - name: Ingest deterministic registry fixtures (no CMS network)
        run: |
          docker compose run --rm --no-deps api python -m app.ingestion --fixture tests/fixtures/cms_registry_a.csv --max-rows 5
          docker compose run --rm --no-deps api python -m app.ingestion --fixture tests/fixtures/cms_registry_b.csv --max-rows 5
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env: {BASE_URL: 'http://127.0.0.1:8080', DATAOPS_E2E: '1'}
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            docs/overview.png
            docs/explorer.png
            docs/provider-profile.png
            docs/comparison.png
            docs/analytics.png
            docs/mobile-analytics.png
            docs/dataops.png
            docs/mobile-dataops.png
            docs/monitoring.png
            docs/mobile-monitoring.png
            docs/mobile.png
            frontend/test-results/
          if-no-files-found: warn
      - if: always()
        run: docker compose down
